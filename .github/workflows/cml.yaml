name: CML CI/CD Workflow

on:
  push:
    branches: [ main ]

jobs:
  run-cml:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Installer les dépendances si requirements.txt existe
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4️⃣ Exécuter main.py
      - name: Run main.py
        run: |
          python main.py

      # 5️⃣ Générer report.md à partir de sortie.txt
      - name: Generate report.md
        run: |
          if [ -f sortie.txt ]; then
            echo "## Message:" > report.md
            cat sortie.txt >> report.md
          else
            echo "## Message:" > report.md
            echo "sortie.txt not found" >> report.md
          fi

      # 6️⃣ Afficher le contenu de sortie.txt dans les logs
      - name: Show sortie.txt
        run: |
          [ -f sortie.txt ] && cat sortie.txt || echo "sortie.txt not found"

      # 7️⃣ Commit & Push automatique
      - name: Commit & Push generated files
        run: |
          git config --global user.email "nyeck@sympatico.ca"
          git config --global user.name "alnyeck"
          [ -f sortie.txt ] && git add sortie.txt
          [ -f report.md ] && git add report.md
          git diff --cached --quiet || git commit -m "Update generated files"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/alnyeck/projet_ci.git
          git push origin HEAD:main || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
